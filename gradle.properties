org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.jetbrains.intellij.platform.downloadSources=true
kotlin.stdlib.default.dependency=false
# The unified IntelliJ IDEA distribution contains an obfuscated Ultimate
# module that is unrelated to AST Lens and cannot start in the unit-test
# container. Keep Java/Kotlin bundled plugins available, but exclude that
# module from the test classpath.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,org.jetbrains.plugins.vue,com.intellij.modules.ultimate
