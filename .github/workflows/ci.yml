name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # gradlew n’est actuellement pas marqué exécutable dans Git.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and run functional tests
        run: >
          ./gradlew
          check
          verifyPluginStructure
          buildPlugin
          --stacktrace
          --warning-mode all

      - name: Run integration tests
        run: >
          xvfb-run --auto-servernum
          ./gradlew integrationTest
          --stacktrace
          --warning-mode all

      - name: Verify IntelliJ compatibility
        run: >
          ./gradlew verifyPlugin
          --stacktrace
          --warning-mode all

      - name: Upload plugin archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ast-lens-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports and IDE logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ast-lens-reports
          path: |
            build/reports/**
            build/test-results/**
            .intellijPlatform/**/log/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14